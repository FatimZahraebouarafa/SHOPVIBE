<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Paiement — ShopVibe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="page-header">
                <h1 class="page-title">💳 Paiement sécurisé</h1>
                <p class="page-subtitle">Choisissez votre mode de paiement</p>
            </div>

            <!-- Montant -->
            <div class="payment-amount-card">
                <div>
                    <div class="payment-amount-label">💰 Montant total</div>
                </div>
                <div class="payment-amount-value" th:text="${#numbers.formatDecimal(command.totalAmount,1,2) + ' €'}"></div>
            </div>

            <div th:if="${error}" class="alert-premium-danger" th:text="${error}"></div>

            <!-- Tabs -->
            <ul class="nav nav-tabs mb-0" id="paymentTabs">
                <li class="nav-item">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#paypal">
                        🅿️ PayPal
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#creditcard">
                        💳 Carte Bancaire
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- PayPal -->
                <div class="tab-pane fade show active" id="paypal">
                    <div class="payment-tab-content">
                        <p class="text-muted mb-4">
                            Connectez-vous à votre compte PayPal pour payer en toute sécurité.
                        </p>
                        <form method="post" th:action="@{/payment/paypal}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="mb-4">
                                <label class="form-label-premium">Adresse email PayPal</label>
                                <input type="email" name="accountNumber" class="form-control-premium"
                                       placeholder="votre@paypal.com" required/>
                            </div>
                            <button type="submit" class="btn-checkout">🔒 Payer avec PayPal</button>
                        </form>
                        <div class="secure-badge">🔒 Paiement sécurisé</div>
                    </div>
                </div>

                <!-- Carte Bancaire -->
                <div class="tab-pane fade" id="creditcard">
                    <div class="payment-tab-content">
                        <p class="text-muted mb-4">
                            Paiement 100% sécurisé par carte bancaire.
                        </p>
                        <form method="post" th:action="@{/payment/creditcard}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="mb-3">
                                <label class="form-label-premium">Numéro de carte</label>
                                <input type="text" name="cardNumber" class="form-control-premium"
                                       placeholder="1234 5678 9012 3456" maxlength="19" required/>
                            </div>
                            <div class="mb-4">
                                <label class="form-label-premium">Date d'expiration</label>
                                <input type="text" name="expirationDate" class="form-control-premium"
                                       placeholder="MM/AA" maxlength="5" required/>
                            </div>
                            <button type="submit" class="btn-checkout">🔒 Payer par Carte</button>
                        </form>
                        <div class="secure-badge">🔒 Paiement sécurisé</div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
