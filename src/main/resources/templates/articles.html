<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catalogue — ShopVibe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Hero -->
<div class="hero-section">
    <div class="container text-center">
        <h1 class="hero-title">🛍️ Notre <span>Catalogue</span></h1>
        <p class="hero-subtitle">Découvrez nos meilleurs produits tech</p>
        <!-- Barre de recherche -->
        <div class="search-section">
            <form method="get" th:action="@{/articles}">
                <div class="search-wrapper">
                    <input type="text" name="keyword"
                           class="search-input"
                           th:value="${keyword}"
                           placeholder="Rechercher un article..."/>
                    <button type="submit" class="btn-search">
                        🔍 Rechercher
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="container pb-5">

    <!-- Résultat recherche -->
    <div th:if="${keyword}" class="mb-4">
        <span class="text-muted">Résultats pour : </span>
        <strong th:text="${keyword}"></strong>
        <a th:href="@{/articles}" class="ms-2 btn btn-sm btn-outline-secondary">
            ✕ Effacer
        </a>
    </div>

    <!-- Grille articles -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
        <div class="col" th:each="article : ${articles}">
            <div class="product-card">
                <!-- Image automatique -->
                <div class="product-img-wrapper">
                    <img th:src="${article.imageUrl}"
                         th:alt="${article.description}"
                         onerror="this.src='/images/default.jpg'"/>
                    <span class="product-category-badge"
                          th:text="${article.category != null ? article.category : 'tech'}">
                    </span>
                </div>
                <div class="product-body">
                    <div class="product-brand" th:text="${article.brand}"></div>
                    <div class="product-name" th:text="${article.description}"></div>
                    <div class="product-price"
                         th:text="${#numbers.formatDecimal(article.price,1,2) + ' €'}">
                    </div>
                </div>
                <div class="product-footer">
                    <form method="post" th:action="@{/cart/add}"
                          class="d-flex gap-2">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <input type="hidden" name="articleId"
                               th:value="${article.idArticle}"/>
                        <input type="number" name="quantity"
                               value="1" min="1"
                               th:max="${article.stock}"
                               class="qty-input"/>
                        <button type="submit" class="btn-add-cart">
                            🛒 Ajouter
                        </button>
                    </form>
                    <a th:href="@{/articles/{id}(id=${article.idArticle})}"
                       class="btn-detail">
                        Voir détail →
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Aucun article -->
    <div th:if="${#lists.isEmpty(articles)}" class="empty-state">
        <div class="icon">🔍</div>
        <h4>Aucun article trouvé</h4>
        <p>Essayez un autre mot-clé</p>
        <a th:href="@{/articles}" class="btn-add-article">
            Voir tout le catalogue
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
