<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion — ShopVibe</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-logo">
            <div class="auth-logo-text">SHOPVIBE</div>
            <div style="color:var(--gray); font-size:0.85rem;">Espace Premium</div>
        </div>
        <div class="auth-card">
            <div class="auth-card-header">
                <div class="auth-card-title">Connexion</div>
                <div class="auth-card-subtitle">
                    Accédez à votre espace personnel
                </div>
            </div>
            <div class="auth-card-body">
                <div th:if="${param.error}" class="alert-premium-danger">
                    ✕ Login ou mot de passe incorrect.
                </div>
                <div th:if="${param.logout}" class="alert-premium-success">
                    ✓ Vous êtes déconnecté.
                </div>
                <form method="post" th:action="@{/login}">
                    <input type="hidden" th:name="${_csrf.parameterName}"
                                         th:value="${_csrf.token}"/>
                    <div class="mb-4">
                        <label class="form-label-premium">Login</label>
                        <input type="text" name="username"
                               class="form-control-premium"
                               placeholder="Votre login" required/>
                    </div>
                    <div class="mb-2">
                        <label class="form-label-premium">Mot de passe</label>
                        <input type="password" name="password"
                               class="form-control-premium"
                               placeholder="••••••••" required/>
                    </div>
                    <button type="submit" class="btn-auth">
                        Se connecter →
                    </button>
                </form>
                <div class="auth-divider mt-4">ou</div>
                <div class="text-center mt-3">
                    <span style="color:var(--gray); font-size:0.9rem;">
                        Pas encore membre ?
                    </span>
                    <a th:href="@{/register}" class="auth-link ms-2">
                        Créer un compte
                    </a>
                </div>
            </div>
        </div>
        <div class="text-center mt-3">
            <a th:href="@{/}" style="color:var(--gray); font-size:0.85rem;
               text-decoration:none;">← Retour à l'accueil</a>
        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
