<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mon Panier — ShopVibe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="page-header">
        <h1 class="page-title">🛒 Mon Panier</h1>
        <p class="page-subtitle">Vérifiez vos articles avant de commander</p>
    </div>

    <!-- Panier vide -->
    <div th:if="${#lists.isEmpty(lines)}" class="empty-state">
        <div class="icon">🛒</div>
        <h4>Votre panier est vide</h4>
        <p>Ajoutez des articles depuis le catalogue</p>
        <a th:href="@{/articles}" class="btn-add-article">
            Voir le catalogue →
        </a>
    </div>

    <div th:unless="${#lists.isEmpty(lines)}" class="row g-4">
        <!-- Tableau articles -->
        <div class="col-lg-8">
            <div class="cart-table">
                <table>
                    <thead>
                        <tr>
                            <th>Article</th>
                            <th>Prix</th>
                            <th>Qté</th>
                            <th>Sous-total</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="line : ${lines}">
                            <td>
                                <div class="cart-item-name" th:text="${line.article.description}"></div>
                                <div class="cart-item-brand" th:text="${line.article.brand}"></div>
                            </td>
                            <td class="cart-price" th:text="${#numbers.formatDecimal(line.article.price,1,2) + ' €'}"></td>
                            <td>
                                <span class="badge bg-secondary rounded-pill" th:text="${line.quantity}"></span>
                            </td>
                            <td class="cart-subtotal" th:text="${#numbers.formatDecimal(line.subTotal,1,2) + ' €'}"></td>
                            <td>
                                <form method="post" th:action="@{/cart/remove/{id}(id=${line.idCommandLine})}">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn-remove">✕</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Récapitulatif -->
        <div class="col-lg-4">
            <div class="order-summary">
                <div class="summary-title">📋 Récapitulatif</div>
                <div class="summary-row">
                    <span class="label">Sous-total</span>
                    <span class="value" th:text="${#numbers.formatDecimal(cart.totalAmount,1,2) + ' €'}"></span>
                </div>
                <div class="summary-row">
                    <span class="label">Livraison</span>
                    <span class="value" style="color:var(--success)">Gratuite</span>
                </div>
                <div class="summary-total">
                    <span class="label">Total</span>
                    <span class="value" th:text="${#numbers.formatDecimal(cart.totalAmount,1,2) + ' €'}"></span>
                </div>
                <form method="post" th:action="@{/cart/confirm}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-checkout">✅ Valider la commande</button>
                </form>
                <a th:href="@{/articles}" class="btn-continue">← Continuer mes achats</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
