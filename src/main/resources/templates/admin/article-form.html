<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Article — ShopVibe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="admin-header">
    <div class="container">
        <h2 class="fw-bold text-white"
            th:text="${article.idArticle != null} ? '✏️ Modifier article' : '➕ Nouvel article'">
        </h2>
    </div>
</div>

<div class="container mt-5" style="max-width: 600px;">
    <div class="admin-form-card">
        <form method="post" th:action="@{/admin/articles/save}"
              th:object="${article}">
            <input type="hidden" th:name="${_csrf.parameterName}"
                                 th:value="${_csrf.token}"/>
            <!-- Champ caché pour l'ID en cas de modification -->
            <input type="hidden" th:field="*{idArticle}"/>

            <div class="mb-4">
                <label class="form-label-premium">Marque</label>
                <input type="text" th:field="*{brand}"
                       class="form-control-premium" placeholder="Ex: Samsung" required/>
            </div>
            <div class="mb-4">
                <label class="form-label-premium">Description</label>
                <input type="text" th:field="*{description}"
                       class="form-control-premium"
                       placeholder="Ex: Smartphone 128Go" required/>
            </div>
            <div class="mb-4">
                <label class="form-label-premium">Prix (€)</label>
                <input type="number" th:field="*{price}"
                       class="form-control-premium" step="0.01"
                       placeholder="Ex: 599.99" required/>
            </div>
            <div class="mb-4">
                <label class="form-label-premium">Stock</label>
                <input type="number" th:field="*{stock}"
                       class="form-control-premium" placeholder="Ex: 50" required/>
            </div>
            <div class="mb-4">
                <label class="form-label-premium">URL de l'image (optionnel)</label>
                <input type="text" th:field="*{imageUrl}"
                       class="form-control-premium" placeholder="Ex: https://example.com/image.jpg"/>
                <small style="color:var(--gray); font-size:0.85rem;">
                    Laissez vide pour utiliser l'image par défaut basée sur la description
                </small>
            </div>

            <div class="d-flex gap-3 mt-5">
                <button type="submit" class="btn-add-article flex-grow-1">
                    💾 Sauvegarder
                </button>
                <a th:href="@{/admin}"
                   class="btn-delete" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px;">
                    Annuler
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
