name: CI - Build and Test

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B test

      - name: Run Checkstyle
        run: ./mvnw -B checkstyle:check

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shopvibe:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shopvibe:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            mkdir -p "$HOME/shopvibe/docker/mysql/init"

      - name: Copy Docker Compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,docker/mysql/init"
          target: "shopvibe"


      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,MYSQL_ROOT_PASSWORD,IMAGE_NAME
          script_stop: true
          script: |
            set -u
            cd "$HOME/shopvibe"

            # 1. Définir des valeurs par défaut si non transmises
            export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME:-${{ secrets.DOCKERHUB_USERNAME }}}"
            export DOCKERHUB_TOKEN="${DOCKERHUB_TOKEN:-${{ secrets.DOCKERHUB_TOKEN }}}"
            export MYSQL_ROOT_PASSWORD="${MYSQL_ROOT_PASSWORD:-${{ secrets.MYSQL_ROOT_PASSWORD }}}"
            export IMAGE_NAME="${IMAGE_NAME:-${{ secrets.DOCKERHUB_USERNAME }}/shopvibe:latest}"

            test -n "$IMAGE_NAME" || { echo "IMAGE_NAME est vide."; exit 1; }
            test -n "$MYSQL_ROOT_PASSWORD" || { echo "MYSQL_ROOT_PASSWORD est vide."; exit 1; }

            printf 'APP_IMAGE=%s\nMYSQL_ROOT_PASSWORD=%s\nAPP_PORT=80\nMYSQL_PORT=3306\n' "$IMAGE_NAME" "$MYSQL_ROOT_PASSWORD" > .env

            echo "Vérification de Docker Compose..."
            if ! docker compose version; then
              echo "Docker Compose est indisponible sur EC2."
              exit 1
            fi

            echo "Connexion à Docker Hub..."
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              printf '%s\n' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            fi

            echo "Téléchargement des images..."
            docker compose pull

            echo "Démarrage des conteneurs..."
            docker compose up -d

            docker compose ps
            docker image prune -f || true